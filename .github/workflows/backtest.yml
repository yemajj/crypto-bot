# .github/workflows/backtest.yml
#
# Fetch real OHLCV data and run a backtest (+ optional walk-forward validation).
#
# Default artifact: results/ only (summary.md, metrics.json, trades.csv,
# config_used.yaml) — small, fast to download, phone-readable.
# Set save_debug_artifacts=true to also include the raw CSV, SQLite journal,
# and structured logs for deeper local analysis.
#
# No API key is required — public OHLCV endpoints are unauthenticated.

name: Run Backtest

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Backtest config file'
        required: true
        default: 'config/backtest.yaml'
        type: choice
        options:
          - config/backtest.yaml
          - config/backtest_rsi.yaml
          - config/backtest_donchian.yaml
          - config/backtest_donchian_4h.yaml
          - config/backtest_donchian_daily.yaml
          - config/backtest_ensemble.yaml
      symbol:
        description: 'Trading pair (e.g. BTC/USDT)'
        required: true
        default: 'BTC/USDT'
      timeframe:
        description: 'Bar timeframe (must match config)'
        required: true
        default: '1h'
        type: choice
        options:
          - 1h
          - 4h
          - 1d
          - 15m
      since:
        description: 'Start date (UTC, YYYY-MM-DD)'
        required: true
        default: '2023-01-01'
      until:
        description: 'End date (UTC, YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''
      walk_forward:
        description: 'Also run walk-forward validation (5 folds)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      save_debug_artifacts:
        description: 'Also save raw CSV, SQLite journal, and logs? (larger download)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Write .env
        run: |
          cat <<EOF > .env
          CRYPTOBOT_ENV=backtest
          CRYPTOBOT_LOG_LEVEL=INFO
          EXCHANGE_NAME=${{ secrets.EXCHANGE_NAME || 'binance' }}
          EXCHANGE_API_KEY=
          EXCHANGE_API_SECRET=
          EXCHANGE_TESTNET=false
          CRYPTOBOT_DB_URL=sqlite:///./data/cryptobot.sqlite
          CRYPTOBOT_DATA_DIR=./data
          CRYPTOBOT_LOG_DIR=./logs
          CRYPTOBOT_KILL_SWITCH_FILE=./KILL_SWITCH
          EOF

      - name: Fetch historical bars
        run: |
          source .venv/bin/activate
          UNTIL_ARG=""
          if [ -n "${{ github.event.inputs.until }}" ]; then
            UNTIL_ARG="--until ${{ github.event.inputs.until }}"
          fi
          cryptobot fetch-history \
            --symbol "${{ github.event.inputs.symbol }}" \
            --timeframe "${{ github.event.inputs.timeframe }}" \
            --since "${{ github.event.inputs.since }}" \
            $UNTIL_ARG

      - name: Export to CSV
        run: |
          source .venv/bin/activate
          SYMBOL_SAFE=$(echo "${{ github.event.inputs.symbol }}" | tr '/' '_')
          CSV_PATH="data/${SYMBOL_SAFE}_${{ github.event.inputs.timeframe }}.csv"
          cryptobot export-csv \
            --symbol "${{ github.event.inputs.symbol }}" \
            --timeframe "${{ github.event.inputs.timeframe }}" \
            --out "${CSV_PATH}"
          echo "CSV_PATH=${CSV_PATH}" >> "$GITHUB_ENV"

      - name: Initialize journal DB
        run: |
          source .venv/bin/activate
          cryptobot init-db

      - name: Copy config snapshot
        run: |
          mkdir -p results/
          cp "${{ github.event.inputs.config }}" results/config_used.yaml

      - name: Run backtest
        run: |
          source .venv/bin/activate
          cryptobot backtest \
            --config "${{ github.event.inputs.config }}" \
            --data "${{ env.CSV_PATH }}" \
            --out-dir results/

      - name: Print summary
        if: always()
        run: |
          echo "===== summary.md ====="
          cat results/summary.md || true

      - name: Run walk-forward validation
        if: ${{ github.event.inputs.walk_forward == 'true' }}
        run: |
          source .venv/bin/activate
          cryptobot walk-forward \
            --config "${{ github.event.inputs.config }}" \
            --data "${{ env.CSV_PATH }}" \
            --folds 5 \
            --in-sample-pct 0.7

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_id }}
          path: results/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload debug artifacts
        if: ${{ always() && github.event.inputs.save_debug_artifacts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: backtest-debug-${{ github.run_id }}
          path: |
            data/*.csv
            data/cryptobot.sqlite
            logs/
          retention-days: 14
          if-no-files-found: warn

