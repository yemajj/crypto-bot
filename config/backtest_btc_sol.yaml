mode: backtest

market:
  symbols:
    - BTC/USDT
    - SOL/USDT
  timeframe: 4h

strategy:
  name: sma_crossover
  params:
    fast: 20
    slow: 50
    atr_window: 14
    risk_per_trade_pct: 0.005
    max_position_notional_pct: 0.09
    adx_window: 14
    adx_threshold: 25

risk:
  max_position_pct: 0.10
  max_gross_exposure_pct: 0.50
  max_daily_loss_pct: 0.02
  max_orders_per_minute: 10
  require_stop_loss: true
  symbol_allow_list:
    - BTC/USDT
    - SOL/USDT
  max_open_positions: 1
  cooldown_after_losses: 3
  cooldown_bars: 6

fees:
  taker_bps: 10.0
  maker_bps: 5.0
  slippage_bps: 5.0

starting_cash: 10000.0
warmup_bars: 60
