# RSI mean-reversion strategy — backtest config.
# Same strategy params as paper_rsi.yaml. Use with a local OHLCV CSV:
#   cryptobot backtest --config config/backtest_rsi.yaml --data path/to/ohlcv.csv

mode: backtest

market:
  symbols:
    - BTC/USDT
  timeframe: 5m

strategy:
  name: rsi
  params:
    window: 14
    oversold: 30.0
    overbought: 70.0
    atr_window: 14
    risk_per_trade_pct: 0.005
    stop_distance_multiplier: 1.5
    buy_threshold: 0.30
    sell_threshold: -0.30

risk:
  max_position_pct: 0.05
  max_gross_exposure_pct: 0.25
  max_daily_loss_pct: 0.01
  max_orders_per_minute: 5
  require_stop_loss: true
  symbol_allow_list:
    - BTC/USDT
  max_open_positions: 1
  cooldown_after_losses: 3
  cooldown_bars: 4

fees:
  taker_bps: 10.0
  maker_bps: 5.0
  slippage_bps: 5.0

starting_cash: 10000.0
warmup_bars: 30
poll_interval_seconds: 30.0
