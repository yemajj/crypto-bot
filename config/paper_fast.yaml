# Fast-testing paper config — SMA(5, 15) on 5m bars.
# Generates crossover signals much more frequently than paper.yaml (20/50).
# Use for development and signal verification only, not production paper trading.

mode: paper

market:
  symbols:
    - BTC/USDT
  timeframe: 5m

strategy:
  name: sma_crossover
  params:
    fast: 5
    slow: 15
    risk_per_trade_pct: 0.005
    atr_window: 14
    max_position_notional_pct: 0.10  # cap each position at 10% of equity regardless of ATR sizing

risk:
  max_position_pct: 0.10            # raised to match strategy notional cap above
  max_gross_exposure_pct: 0.25
  max_daily_loss_pct: 0.01
  max_orders_per_minute: 5
  require_stop_loss: true
  symbol_allow_list:
    - BTC/USDT
  max_open_positions: 1
  cooldown_after_losses: 3
  cooldown_bars: 4

fees:
  taker_bps: 10.0
  maker_bps: 5.0
  slippage_bps: 5.0

starting_cash: 10000.0
warmup_bars: 30
poll_interval_seconds: 30.0
