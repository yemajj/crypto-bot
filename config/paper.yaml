mode: paper

market:
  symbols:
    - BTC/USDT
  timeframe: 1h

strategy:
  name: sma_crossover
  params:
    fast: 20
    slow: 50
    risk_per_trade_pct: 0.005
    atr_window: 14

risk:
  max_position_pct: 0.05          # tighter than backtest
  max_gross_exposure_pct: 0.25
  max_daily_loss_pct: 0.01        # 1% daily kill-switch in paper
  max_orders_per_minute: 5
  require_stop_loss: true
  symbol_allow_list:
    - BTC/USDT

fees:
  taker_bps: 10.0
  maker_bps: 5.0
  slippage_bps: 5.0
