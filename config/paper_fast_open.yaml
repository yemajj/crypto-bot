# Testing-only paper config — SMA(5,15) + loosened circuit breakers.
# Purpose: generate enough SMA crossover trades in a single session to produce
# a meaningful sample quickly. NOT for production paper trading — restore tight
# caps before treating any run as Phase 6 validation evidence.
#
# Key differences vs paper_fast.yaml:
#   max_daily_loss_pct  0.01 → 0.05  (one bad trade won't freeze the session)
#   max_orders_per_minute 5 → 15     (headroom for faster signal rate)
#   cooldown_after_losses 3 → 5      (less aggressive loss-streak pause)
#   cooldown_bars       4 → 2        (shorter freeze when cooldown triggers)

mode: paper

market:
  symbols:
    - BTC/USDT
  timeframe: 5m

strategy:
  name: sma_crossover
  params:
    fast: 5
    slow: 15
    risk_per_trade_pct: 0.005
    atr_window: 14
    max_position_notional_pct: 0.05  # cap each position at 5% of equity

risk:
  max_position_pct: 0.05
  max_gross_exposure_pct: 0.25
  max_daily_loss_pct: 0.05
  max_orders_per_minute: 15
  require_stop_loss: true
  symbol_allow_list:
    - BTC/USDT
  max_open_positions: 1
  cooldown_after_losses: 5
  cooldown_bars: 2

fees:
  taker_bps: 10.0
  maker_bps: 5.0
  slippage_bps: 5.0

starting_cash: 10000.0
warmup_bars: 30
poll_interval_seconds: 30.0
