mode: backtest

market:
  symbols:
    - BTC/USDT
  timeframe: 15m

strategy:
  name: donchian
  params:
    window: 20                   # 20-bar channel = ~5h on 15m
    atr_window: 14
    risk_per_trade_pct: 0.005
    stop_distance_multiplier: 1.5
    buy_threshold: 0.5           # fires on score=+1.0 (close > 20-bar high)
    sell_threshold: -0.5         # fires on score=-1.0 (close < 20-bar low)
    max_position_notional_pct: 0.04

risk:
  max_position_pct: 0.05
  max_gross_exposure_pct: 0.25
  max_daily_loss_pct: 0.02
  max_orders_per_minute: 10
  require_stop_loss: true
  symbol_allow_list:
    - BTC/USDT
  max_open_positions: 1
  cooldown_after_losses: 3
  cooldown_bars: 6

fees:
  taker_bps: 10.0
  maker_bps: 5.0
  slippage_bps: 5.0

starting_cash: 10000.0
warmup_bars: 30
